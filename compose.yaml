name: virtshield
services:
  app:
    build: ./lab
    image: virtshield-app:local
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      APP_DB_USER: app_user
      APP_PASSWORD_FILE: /run/secrets/app_password
      PYTHONDONTWRITEBYTECODE: "1"
    secrets: [app_password]
    networks: [frontend, database]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: virtshield
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password, app_password]
    networks: [database]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./lab/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d virtshield"]
      interval: 2s
      timeout: 3s
      retries: 20
networks:
  frontend: {}
  database:
    internal: true
secrets:
  db_password:
    file: ./secrets/db_password
  app_password:
    file: ./secrets/app_password
volumes:
  db_data: {}
